create_playlist:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: snapdog
    name:
      required: true
      example: Evening
      selector:
        text:
    track_ids:
      required: false
      example: '["tr-1", "song/tr-2"]'
      selector:
        text:
          multiple: true
rename_playlist:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: snapdog
    playlist_id:
      required: true
      example: subsonic:42
      selector:
        text:
    name:
      required: true
      example: Evening
      selector:
        text:
add_tracks_to_playlist:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: snapdog
    playlist_id:
      required: true
      example: subsonic:42
      selector:
        text:
    track_ids:
      required: true
      example: '["tr-1", "song/tr-2"]'
      selector:
        text:
          multiple: true
remove_tracks_from_playlist:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: snapdog
    playlist_id:
      required: true
      example: subsonic:42
      selector:
        text:
    positions:
      required: true
      example: "[0, 3]"
      selector:
        object:
replace_playlist_tracks:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: snapdog
    playlist_id:
      required: true
      example: subsonic:42
      selector:
        text:
    track_ids:
      required: true
      example: '["tr-1", "song/tr-2"]'
      selector:
        text:
          multiple: true
delete_playlist:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: snapdog
    playlist_id:
      required: true
      example: subsonic:42
      selector:
        text:
move_client:
  target:
    device:
      integration: snapdog
    entity:
      integration: snapdog
      domain: number
  fields:
    zone:
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 99
          mode: box
rename_client:
  target:
    device:
      integration: snapdog
    entity:
      integration: snapdog
      domain: number
  fields:
    name:
      required: true
      example: Kitchen speaker
      selector:
        text:
apply_speaker_profile:
  target:
    device:
      integration: snapdog
      model: SnapDog client
    entity:
      integration: snapdog
      domain: number
  fields:
    speaker:
      required: true
      example: Genelec 8030C
      selector:
        text:
set_client_eq:
  target:
    device:
      integration: snapdog
      model: SnapDog client
    entity:
      integration: snapdog
      domain: number
  fields:
    enabled:
      required: false
      selector:
        boolean:
    bands:
      required: false
      example: '[{"freq": 100, "gain": 3, "q": 0.7, "type": "low_shelf"}]'
      selector:
        object:
set_client_eq_band:
  target:
    device:
      integration: snapdog
      model: SnapDog client
    entity:
      integration: snapdog
      domain: number
  fields:
    band:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box
    freq:
      required: true
      example: 100
      selector:
        number:
          min: 1
          max: 24000
          unit_of_measurement: Hz
          mode: box
    gain:
      required: true
      example: 3
      selector:
        number:
          min: -24
          max: 24
          step: 0.1
          unit_of_measurement: dB
          mode: box
    q:
      required: true
      example: 0.7
      selector:
        number:
          min: 0.01
          max: 20
          step: 0.01
          mode: box
    type:
      required: true
      selector:
        select:
          options:
            - low_shelf
            - high_shelf
            - peaking
            - low_pass
            - high_pass
